# Test model profiles for LLM integration tests.
# API keys are resolved from OS Keyring via vault:// references.
default_profile:
  provider: anthropic
  model: claude-sonnet-4-6

providers:
  anthropic:
    api_keys:
      - name: default
        secret: "vault://providers/anthropic/default"
        models:
          - name: claude-sonnet-4-6
          - name: claude-sonnet-4-5
          - name: claude-opus-4-8
          - name: claude-haiku-4-5
  openai:
    api_keys:
      - name: default
        secret: "vault://providers/openai/default"
        models:
          - name: gpt-4o
          - name: gpt-5.6-terra
          - name: gpt-4o-mini
          - name: gpt-4.1-mini
          - name: gpt-5.4-mini
          - name: gpt-5.5
          - name: gpt-5.5-pro
          - name: gpt-5.3-codex
            mode: responses
          - name: text-embedding-3-small
            mode: embedding
  google:
    api_keys:
      - name: default
        secret: "vault://providers/google/default"
        models:
          - name: gemini-2.5-flash
            behavior:
              max_output_tokens: 65536
          - name: gemini-2.5-pro
            behavior:
              max_output_tokens: 65536
          - name: gemini-3.5-flash
            behavior:
              max_output_tokens: 65536
          - name: text-embedding-004
            mode: embedding
  ollama:
    api_keys:
      - name: default
        models:
          - name: gemma3:4b
          - name: nomic-embed-text
            mode: embedding

coding_agents:
  codex:
    max_prompt_bytes: 1048576 # 1MB
    execution_mode: single_shot
  claudecode:
    execution_mode: single_shot
