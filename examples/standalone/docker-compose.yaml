version: '3.8'

services:
  hag-standalone:
    build:
      context: ../..
      dockerfile: examples/standalone/Dockerfile
    ports:
      - "14000:14000" # LLM Gateway Proxy Port
      - "18080:18080" # API / WebSocket Port (wsserver/agentservice skeleton)
    volumes:
      - ./config.yaml:/etc/hag/config.yaml
      - ./model_profiles.yaml:/etc/hag/model_profiles.yaml
    environment:
      - HAG_VAULT_KEY=super-secret-key-123
      - HAG_VAULT_PROVIDERS_OPENAI_DEFAULT=sk-proj-openai-test-key
      - HAG_VAULT_PROVIDERS_ANTHROPIC_PRIMARY=sk-ant-test-key
    restart: always
