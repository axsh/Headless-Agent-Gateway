# Minimal model_profiles.yaml example
# One cost-effective model per provider for quick start.

# Default profile
default_profile:
  provider: ollama
  model: qwen2.5-coder:7b

providers:
  # OpenAI
  openai:
    api_keys:
      - name: default
        secret: vault://providers/openai/default
        models:
          - name: gpt-4o-mini
          - name: gpt-4o
          - name: gpt-4.1-mini
          - name: gpt-5.3-codex
            mode: responses
          # GPT-6 reasoning model configuration example
          # - name: gpt-6-astra
          #   mode: responses
          #   behavior:
          #     reasoning:
          #       required: true
          #       supported_efforts: ["minimal", "low", "medium", "high", "xhigh", "max"]
          #       default_effort: medium
          - name: text-embedding-3-small
            mode: embedding
          - name: text-embedding-3-large
            mode: embedding

  # Anthropic
  anthropic:
    api_keys:
      - name: default
        secret: vault://providers/anthropic/default
        models:
          - name: claude-haiku-4-5
          - name: claude-sonnet-4-6
          - name: claude-opus-4-8

  # Google (cheapest: gemini-2.5-flash)
  google:
    api_keys:
      - name: default
        secret: vault://providers/google/default
        models:
          - name: gemini-2.5-flash
            behavior:
              structured_output: true
              max_output_tokens: 65536
          - name: text-embedding-004
            mode: embedding

  # Ollama (local inference, no API key required)
  ollama:
    api_keys:
      - name: default
        models:
          - name: qwen2.5-coder:7b
            behavior:
              tool_call_fallback: true
          - name: nomic-embed-text
            mode: embedding
    network_config:
      base_url: "http://localhost:11434"

coding_agents:
  codex:
    max_prompt_bytes: 1048576 # 1MB
    max_execution_seconds: 3600
    idle_timeout_seconds: 300
    execution_mode: single_shot
  claudecode:
    max_execution_seconds: 3600
    idle_timeout_seconds: 300
    execution_mode: single_shot
